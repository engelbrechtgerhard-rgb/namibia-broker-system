version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Disable default global package installation
        - rm -f /root/.nvm/default-packages

        # Install and use Node 20
        - nvm install 20
        - nvm use 20

        # Install project dependencies
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*