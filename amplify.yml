version: 1

backend:
  phases:
    build:
      commands:
        - nvm install 20
        - nvm use 20
        - rm -rf node_modules
        - cd amplify && npm install
        - export npm_config_user_agent="npm"
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --outputs-out-dir ..

frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - amplify/node_modules/**/*
