version: 1

backend:
  phases:
    build:
      commands:
        - |
          cd amplify
          rm -rf node_modules
          nvm install 20
          nvm use 20
          npm install --ignore-scripts @aws-amplify/backend-cli@latest
          export npm_config_user_agent="npm"
          node -v
          npm -v
          ./node_modules/.bin/ampx pipeline-deploy --branch main --app-id d3ag1h0byiiz37

frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths: []
