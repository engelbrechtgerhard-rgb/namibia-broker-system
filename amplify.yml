version: 1

backend:
  phases:
    build:
      commands:
        - nvm install 20
        - nvm use 20
        - rm -rf node_modules amplify/node_modules
        - npm install --prefix amplify
        - export npm_config_user_agent="npm"
        - ./amplify/node_modules/.bin/ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID

frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - amplify/node_modules/**/*
